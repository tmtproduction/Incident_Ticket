<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMT Issue Tracker — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="shared.css">
<style>
.pareto-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.pareto-label { width: 130px; font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pareto-track { flex: 1; background: var(--gray-border); border-radius: 3px; height: 14px; }
.pareto-fill  { height: 14px; border-radius: 3px; background: var(--purple); }
.pareto-count { font-size: 12px; font-weight: 500; color: var(--text); width: 24px; text-align: right; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width:640px){ .two-col{grid-template-columns:1fr;} }
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="logo">TMT</div>
    <span>Issue Tracker</span>
  </div>
  <nav class="topbar-nav">
    <a href="index.html" class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
    <a href="report.html"><i class="fa-solid fa-plus"></i> รายงานปัญหา</a>
    <a href="update.html"><i class="fa-solid fa-pen-to-square"></i> อัพเดทสถานะ</a>
    <a href="admin.html"><i class="fa-solid fa-sliders"></i> Admin</a>
  </nav>
  <a href="report.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> รายงานปัญหา</a>
</div>

<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Dashboard</div>
      <div class="page-sub" id="last-updated">กำลังโหลด...</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="filter-period" class="field" style="margin:0;padding:6px 28px 6px 10px;font-size:12px;border:1px solid var(--gray-border);border-radius:6px">
        <option value="all">ทุกช่วงเวลา</option>
        <option value="7">7 วันล่าสุด</option>
        <option value="30" selected>30 วันล่าสุด</option>
        <option value="90">90 วันล่าสุด</option>
      </select>
    </div>
  </div>

  <!-- Metrics -->
  <div class="metrics" id="metrics">
    <div class="metric"><div class="metric-label">ทั้งหมด</div><div class="metric-value v-all" id="m-total">—</div><div class="metric-sub">issues</div></div>
    <div class="metric"><div class="metric-label">Open</div><div class="metric-value v-open" id="m-open">—</div><div class="metric-sub">ยังไม่เริ่มแก้</div></div>
    <div class="metric"><div class="metric-label">In Progress</div><div class="metric-value v-prog" id="m-prog">—</div><div class="metric-sub">กำลังดำเนินการ</div></div>
    <div class="metric"><div class="metric-label">Closed</div><div class="metric-value v-done" id="m-done">—</div><div class="metric-sub">แก้ไขเสร็จแล้ว</div></div>
  </div>

  <!-- Charts row -->
  <div class="two-col" style="margin-bottom:24px">
    <div class="card" style="margin-bottom:0">
      <div class="card-title" style="font-size:13px">ปัญหาที่เกิดบ่อย (Pareto)</div>
      <div id="pareto-list"><div class="loading">กำลังโหลด...</div></div>
    </div>
    <div class="card" style="margin-bottom:0">
      <div class="card-title" style="font-size:13px">แยกตามประเภท</div>
      <div id="type-list"><div class="loading">กำลังโหลด...</div></div>
    </div>
  </div>

  <!-- Filter + Issue list -->
  <div class="filter-bar">
    <button class="filter-btn active" data-status="all">ทั้งหมด</button>
    <button class="filter-btn" data-status="open">Open</button>
    <button class="filter-btn" data-status="inprogress">In Progress</button>
    <button class="filter-btn" data-status="closed">Closed</button>
    <button class="filter-btn" data-status="machine">เครื่องจักร</button>
    <button class="filter-btn" data-status="safety">Safety</button>
  </div>

  <div id="issue-list"><div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> กำลังโหลด...</div></div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
let allIssues = [];
let currentFilter = 'all';

const periodEl = document.getElementById('filter-period');
periodEl.addEventListener('change', loadIssues);

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.status;
    renderList();
  });
});

async function loadIssues() {
  try {
    const days = parseInt(periodEl.value) || 0;
    let query = db.collection('issues').orderBy('createdAt', 'desc');
    if (days > 0) {
      const since = new Date();
      since.setDate(since.getDate() - days);
      query = query.where('createdAt', '>=', since);
    }
    const snap = await query.get();
    allIssues = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMetrics();
    renderPareto();
    renderTypeChart();
    renderList();
    document.getElementById('last-updated').textContent =
      'อัพเดทล่าสุด: ' + new Date().toLocaleString('th-TH');
  } catch(e) {
    console.error(e);
    document.getElementById('issue-list').innerHTML =
      '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i> ไม่สามารถโหลดข้อมูลได้ — ตรวจสอบ Firebase Config</div>';
  }
}

function renderMetrics() {
  const total = allIssues.length;
  const open  = allIssues.filter(i => i.status === 'open').length;
  const prog  = allIssues.filter(i => i.status === 'inprogress').length;
  const done  = allIssues.filter(i => i.status === 'closed').length;
  document.getElementById('m-total').textContent = total;
  document.getElementById('m-open').textContent  = open;
  document.getElementById('m-prog').textContent  = prog;
  document.getElementById('m-done').textContent  = done;
}

function renderPareto() {
  const counts = {};
  allIssues.forEach(i => {
    const k = i.machineName || i.category || 'ไม่ระบุ';
    counts[k] = (counts[k] || 0) + 1;
  });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,6);
  const max = sorted[0]?.[1] || 1;
  const html = sorted.length === 0
    ? '<div class="empty">ยังไม่มีข้อมูล</div>'
    : sorted.map(([k,v]) => `
      <div class="pareto-bar">
        <div class="pareto-label" title="${k}">${k}</div>
        <div class="pareto-track"><div class="pareto-fill" style="width:${Math.round(v/max*100)}%"></div></div>
        <div class="pareto-count">${v}</div>
      </div>`).join('');
  document.getElementById('pareto-list').innerHTML = html;
}

function renderTypeChart() {
  const machine = allIssues.filter(i => i.issueType === 'machine').length;
  const safety  = allIssues.filter(i => i.issueType === 'safety').length;
  const total   = allIssues.length || 1;
  document.getElementById('type-list').innerHTML = `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span><i class="fa-solid fa-gear" style="color:var(--purple)"></i> เครื่องจักร</span>
        <span style="font-weight:500">${machine} issue</span>
      </div>
      <div style="background:var(--gray-border);border-radius:3px;height:16px">
        <div style="height:16px;border-radius:3px;background:var(--purple);width:${Math.round(machine/total*100)}%"></div>
      </div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span><i class="fa-solid fa-triangle-exclamation" style="color:var(--coral)"></i> Safety / อุบัติเหตุ</span>
        <span style="font-weight:500">${safety} issue</span>
      </div>
      <div style="background:var(--gray-border);border-radius:3px;height:16px">
        <div style="height:16px;border-radius:3px;background:var(--coral);width:${Math.round(safety/total*100)}%"></div>
      </div>
    </div>
    <div style="margin-top:16px;font-size:12px;color:var(--text-hint);text-align:center">${total} issues รวมทั้งหมด</div>
  `;
}

function renderList() {
  let filtered = allIssues;
  if (currentFilter === 'open')      filtered = allIssues.filter(i => i.status === 'open');
  else if (currentFilter === 'inprogress') filtered = allIssues.filter(i => i.status === 'inprogress');
  else if (currentFilter === 'closed')  filtered = allIssues.filter(i => i.status === 'closed');
  else if (currentFilter === 'machine') filtered = allIssues.filter(i => i.issueType === 'machine');
  else if (currentFilter === 'safety')  filtered = allIssues.filter(i => i.issueType === 'safety');

  if (filtered.length === 0) {
    document.getElementById('issue-list').innerHTML = '<div class="empty">ไม่พบ issue</div>';
    return;
  }

  const html = filtered.map(issue => {
    const isIcon  = issue.issueType === 'safety' ? 'fa-triangle-exclamation' : 'fa-gear';
    const iconCls = issue.issueType === 'safety' ? 'icon-safety' : 'icon-machine';
    const statusLabel = { open:'Open', inprogress:'In Progress', closed:'Closed' }[issue.status] || issue.status;
    const badgeCls = `badge-${issue.status}`;
    const date = issue.createdAt?.toDate?.()?.toLocaleDateString('th-TH', {day:'numeric',month:'short',year:'2-digit'}) || '—';
    return `
      <a class="issue-card ${issue.status}" href="update.html?id=${issue.id}">
        <div class="issue-icon ${iconCls}"><i class="fa-solid ${isIcon}"></i></div>
        <div class="issue-body">
          <div class="issue-title">${issue.title || '(ไม่มีชื่อ)'}</div>
          <div class="issue-meta">${issue.lineName || '—'} · ${issue.machineName || '—'} · #${issue.id.slice(-6).toUpperCase()} · ${date}</div>
        </div>
        <div class="issue-right">
          <span class="badge ${badgeCls}">${statusLabel}</span>
          <span class="issue-assignee">${issue.assignee || '—'}</span>
        </div>
      </a>`;
  }).join('');
  document.getElementById('issue-list').innerHTML = html;
}

loadIssues();
</script>
</body>
</html>
